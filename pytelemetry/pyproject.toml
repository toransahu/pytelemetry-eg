[project]
name = "toran-pytelemetry"
version = "0.1.0"
description = "Minimal OpenTelemetry-based instrumentation helpers"
requires-python = ">=3.10"

dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["toran*"]
